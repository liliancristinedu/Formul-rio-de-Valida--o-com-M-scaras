<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade prática</title>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Validação e Máscaras em Formulários com JavaScript Moderno.</h1>
        <form id="formulario">
            <label>Nome:</label>
            <input type="nome" id="nome" placeholder="Seu Nome" minlength="3" required><br><br>
            <label>Email:</label>
            <input type="email" id="email" placeholder="seuemail@dominio.com" required><br><br>
            <label>Telefone:</label>
            <input type="tel" id="telefone" placeholder="(XX) XXXXX-XXXX" maxlength="15" required><br><br>
            <label>CPF:</label>
            <input type="text" id="cpf" placeholder="XXX.XXX.XXX-XX" maxlength="14" required><br><br>
            <label>Data de nascimento:</label>
            <input type="date" id="datadenascimento" required><br><br>
            <button type="submit">Enviar</button>
        </form>
</body>
</html>
